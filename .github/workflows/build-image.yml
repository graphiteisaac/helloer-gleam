name: Build container image
on:
  push:
    branches: ["main"]

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build . --file Dockerfile --tag webapp

      - name: Log in to registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io \
            -u "$ACTOR" --password-stdin

      - name: Push image
        run: |
          IMAGE_ID=ghcr.io/graphiteisaac/helloer-gleam
          TAG="$IMAGE_ID":${GITHUB_REF_NAME}
          docker tag webapp "$TAG"
          docker push "$TAG"
